spring:
  application:
    name: warehouse-optimizer

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/warehouse}
    username: ${DB_USER:warehouse}
    password: ${DB_PASSWORD:warehouse}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2000ms

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

server:
  port: ${PORT:8080}
  servlet:
    context-path: /

app:
  scoring:
    default-weights:
      w1: 0.5
      w2: 0.35
      w3: 0.15
    velocity-days: 90
  seed:
    enabled: ${SEED_DATA:false}
  jwt:
    secret: ${JWT_SECRET:dev-secret-change-me-please-use-a-long-random-string-32b+}
    expiry-seconds: ${JWT_EXPIRY_SECONDS:86400}
    guest-expiry-seconds: ${JWT_GUEST_EXPIRY_SECONDS:7200}
